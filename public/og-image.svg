<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="aura" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FF7A32" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#FF5A12" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9457"/>
      <stop offset="50%" stop-color="#FF7A32"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#050505"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#aura)"/>

  <!-- Subtle Framing Border -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1.5"/>

  <!-- Top Category Tag -->
  <g transform="translate(100, 95)">
    <rect width="216" height="32" rx="16" fill="#1C1714" stroke="#FF7A32" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#FF7A32"/>
    <text x="34" y="21" fill="#FF9457" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2">TRAINING SYSTEMS</text>
  </g>

  <!-- Central Brand Icon & Typography -->
  <g transform="translate(100, 160)">
    <!-- FORGE Iconic Tiered Anvil Mark -->
    <g transform="translate(0, 12)">
      <path d="M 12 0 L 68 0 L 58 16 L 2 16 Z" fill="#FF9457"/>
      <path d="M 8 22 L 52 22 L 43 38 L 0 38 Z" fill="#FF7A32"/>
      <path d="M 4 44 L 36 44 L 28 60 L 0 60 Z" fill="#FF5A12"/>
    </g>

    <!-- Brand Wordmark -->
    <text x="96" y="66" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" letter-spacing="4">FORGE</text>
  </g>

  <!-- Value Proposition Heading -->
  <g transform="translate(100, 290)">
    <text x="0" y="44" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Train with evidence.
    </text>
    <text x="0" y="98" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Progress with intent.
    </text>
    <text x="0" y="148" fill="#8E8E93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
      Evidence-based workout logging, progressive overload tracking, and training intelligence.
    </text>
  </g>

  <!-- Bottom Badges / Architectural Pillars -->
  <g transform="translate(100, 505)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="38" rx="8" fill="#0C0C0F" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
      <circle cx="20" cy="19" r="3" fill="#10B981"/>
      <text x="32" y="24" fill="#A3A3A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">Local-First Storage</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(225, 0)">
      <rect width="230" height="38" rx="8" fill="#0C0C0F" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
      <circle cx="20" cy="19" r="3" fill="#FF7A32"/>
      <text x="32" y="24" fill="#A3A3A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">Verifiable Overload</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(470, 0)">
      <rect width="240" height="38" rx="8" fill="#0C0C0F" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
      <circle cx="20" cy="19" r="3" fill="#FFA875"/>
      <text x="32" y="24" fill="#A3A3A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">Advisory Intelligence</text>
    </g>
  </g>
</svg>
